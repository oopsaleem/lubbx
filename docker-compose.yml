services:
  db:
    container_name: gf
    image: postgres
    restart: always
    ports:
      - 2027:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db_gf:/var/lib/postgresql/data

  redis:
    container_name: gf_redis
    image: redis:alpine
    restart: always
    ports:
      - 2030:6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  db_gf:
  redis_data:
