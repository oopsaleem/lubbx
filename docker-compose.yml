services:
  db:
    image: postgres
    container_name: supa-new
    restart: always
    ports:
      - 2027:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db-supa-new:/var/lib/postgresql/data

  minio:
   image: minio/minio
   restart: always
   container_name: supa-new-minio
   environment:
       MINIO_ROOT_USER: minioadmin
       MINIO_ROOT_PASSWORD: minioadmin
   ports:
       - "9000:9000"
       - "9001:9001"
   volumes:
       - minio_data:/data
   command: server /data --console-address ":9001"
   healthcheck:
       test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
       interval: 30s
       timeout: 20s
       retries: 3

volumes:
  db-supa-new:
  minio_data:
